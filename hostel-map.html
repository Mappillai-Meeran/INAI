<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INAI — Hostel Map</title>
  <meta name="description" content="Visual hostel room map — see who lives where across all hostels." />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/favicon-bg-removed.png" />
  <style>
    /* ── Hostel Map Styles ── */
    .map-header { margin-bottom: 24px; }

    /* Search bar */
    .map-search {
      display: flex; gap: 12px; align-items: center;
      background: rgba(19,21,36,0.7);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 16px;
      margin-bottom: 20px;
    }
    .map-search input {
      flex: 1; background: transparent; border: none;
      color: var(--offwht); font-size: 14px; outline: none;
      font-family: 'DM Sans', sans-serif;
    }
    .map-search input::placeholder { color: var(--muted); }

    /* Legend */
    .map-legend {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-bottom: 20px; align-items: center;
    }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted); font-weight: 600;
    }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 3px;
    }

    /* Hostel section */
    .hostel-section {
      margin-bottom: 32px;
    }
    .hostel-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .hostel-badge {
      padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .hostel-badge.male   { background: rgba(6,182,212,0.15);  color: var(--cyan);   border: 1px solid rgba(6,182,212,0.3); }
    .hostel-badge.female { background: rgba(236,72,153,0.15); color: #F472B6; border: 1px solid rgba(236,72,153,0.3); }
    .hostel-badge.mixed  { background: rgba(99,102,241,0.15); color: var(--violet); border: 1px solid rgba(99,102,241,0.3); }

    /* Block group inside hostel */
    .block-group { margin-bottom: 20px; }
    .block-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 10px; font-family: 'Space Grotesk', sans-serif;
    }

    /* Room grid */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px;
    }

    /* Individual room tile */
    .room-tile {
      position: relative;
      background: rgba(19,21,36,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 6px 8px;
      text-align: center;
      cursor: default;
      transition: all 0.18s ease;
      min-height: 80px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      gap: 4px;
    }
    .room-tile.empty {
      opacity: 0.28;
    }
    .room-tile.occupied {
      background: rgba(99,102,241,0.08);
      border-color: rgba(99,102,241,0.25);
      cursor: pointer;
    }
    .room-tile.occupied:hover {
      background: rgba(99,102,241,0.15);
      border-color: rgba(99,102,241,0.5);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.2);
    }
    .room-tile.self-tile {
      background: rgba(6,182,212,0.12);
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(6,182,212,0.18);
      animation: pulse-glow 2.5s ease-in-out infinite;
      cursor: default;
    }
    .room-tile.connected-tile {
      background: rgba(16,185,129,0.08);
      border-color: rgba(16,185,129,0.3);
    }
    .room-tile.connected-tile:hover {
      background: rgba(16,185,129,0.15);
      border-color: rgba(16,185,129,0.5);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(16,185,129,0.2);
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(6,182,212,0.2); }
      50%       { box-shadow: 0 0 22px rgba(6,182,212,0.45); }
    }

    /* Room number label */
    .room-num {
      font-size: 9px; font-weight: 700;
      color: var(--muted); font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px; margin-bottom: 2px;
    }

    /* Avatar inside room */
    .room-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
      font-family: 'Space Grotesk', sans-serif;
      color: #fff; flex-shrink: 0;
    }
    .room-avatar.anon {
      background: rgba(255,255,255,0.06);
      border: 1.5px dashed rgba(255,255,255,0.15);
      font-size: 16px; color: rgba(255,255,255,0.2);
    }

    /* User name below avatar */
    .room-name {
      font-size: 8.5px; font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 64px;
      line-height: 1.2;
    }

    /* Free now dot */
    .free-dot {
      position: absolute; top: 6px; right: 6px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px rgba(16,185,129,0.6);
    }

    /* Connected badge */
    .connected-badge {
      position: absolute; top: 5px; left: 5px;
      font-size: 8px; color: var(--green);
      font-weight: 800;
    }

    /* Tooltip */
    .room-tooltip {
      position: fixed; z-index: 9999;
      background: rgba(15,15,25,0.97);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px;
      backdrop-filter: blur(16px);
      pointer-events: none; display: none;
      min-width: 180px; max-width: 220px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .room-tooltip.visible { display: block; }

    /* Stats bar */
    .map-stats {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .map-stat-chip {
      background: rgba(19,21,36,0.7);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px;
      font-size: 12px; font-weight: 600;
      color: var(--muted); display: flex; align-items: center; gap: 6px;
    }
    .map-stat-chip span { color: var(--offwht); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      showLoader();
      try { await initData(); } finally { hideLoader(); }
      const user = requireLogin();
      if (!user) return;
      injectBaseStyles();
      renderMapPage(user);
    });

    const AVATAR_COLORS_MAP = [
      "#6366F1","#06B6D4","#10B981","#FBBF24",
      "#EF4444","#3B82F6","#EC4899","#F97316","#8B5CF6","#14B8A6"
    ];
    function avatarColor(name) {
      let h = 0;
      for (let i = 0; i < (name||"").length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
      return AVATAR_COLORS_MAP[(h >>> 0) % AVATAR_COLORS_MAP.length];
    }
    function initials(name) {
      return (name||"??").split(" ").map(w => w[0]||"").join("").toUpperCase().slice(0, 2);
    }

    let allUsers = [];
    let currentUser = null;
    let connectedIds = new Set();
    let searchQuery = "";

    function renderMapPage(user) {
      currentUser = user;
      allUsers = (typeof USERS_CACHE !== "undefined" ? USERS_CACHE : []);
      const reqs = (typeof REQUESTS_CACHE !== "undefined" ? REQUESTS_CACHE : []);
      connectedIds = new Set(
        reqs.filter(r => r.status === "accepted" && (r.from === user.id || r.to === user.id))
            .map(r => r.from === user.id ? r.to : r.from)
      );

      const myHostel = (user.hostel || "").trim();

      // Stats scoped to own hostel only
      const hostelMates = allUsers.filter(u =>
        u.id !== user.id &&
        (u.hostel || "").trim() === myHostel
      );
      const totalUsers = hostelMates.length;
      const freeNow    = hostelMates.filter(u => u.freeNow).length;
      const connected  = connectedIds.size;

      document.getElementById("app").innerHTML = `
      ${renderNav("map")}
      <div class="inai-page" style="max-width:1000px;">

        <div class="map-header">
          <h2 class="inai-section-title" style="font-size:24px;">🏠 ${sanitize(myHostel || "Hostel")} Map</h2>
          <p class="inai-section-sub">Your hostel room map — see who lives in your hostel.</p>
        </div>

        <!-- Stats -->
        <div class="map-stats">
          <div class="map-stat-chip">👥 <span>${totalUsers}</span> Hostelmates</div>
          <div class="map-stat-chip">🟢 <span>${freeNow}</span> Free Now</div>
          <div class="map-stat-chip">🔗 <span>${connected}</span> Connected</div>
        </div>

        <!-- Search -->
        <div class="map-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="map-search-input" placeholder="Search by name, block or room…" oninput="handleSearch(this.value)" />
        </div>

        <!-- Legend -->
        <div class="map-legend">
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(6,182,212,0.3);border:1.5px solid var(--cyan);"></div>
            <span>You</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(16,185,129,0.2);border:1px solid rgba(16,185,129,0.4);"></div>
            <span>Connected</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);"></div>
            <span>Occupied</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="opacity:0.3;background:rgba(19,21,36,0.6);border:1px solid rgba(255,255,255,0.06);"></div>
            <span>Empty</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:var(--green);border-radius:50%;width:8px;height:8px;box-shadow:0 0 6px rgba(16,185,129,0.6);"></div>
            <span>Free Now</span>
          </div>
        </div>

        <!-- Map content -->
        <div id="map-content"></div>

      </div>

      <!-- Tooltip -->
      <div id="room-tooltip" class="room-tooltip"></div>
      `;

      renderAllHostels();
      checkNotifications();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderAllHostels();
    }

    function renderAllHostels() {
      const container = document.getElementById("map-content");
      if (!container) return;

      const myHostel = (currentUser.hostel || "Unknown Hostel").trim();

      // Only show rooms in the current user's own hostel
      let hostelUsers = allUsers.filter(u =>
        (u.hostel || "Unknown Hostel").trim() === myHostel
      );

      // Always ensure current user appears in their own hostel
      if (!hostelUsers.find(u => u.id === currentUser.id)) {
        hostelUsers = [currentUser, ...hostelUsers];
      }

      // Apply search filter within this hostel (by name, block, or room)
      if (searchQuery) {
        const filtered = hostelUsers.filter(u =>
          (u.name  || "").toLowerCase().includes(searchQuery) ||
          (u.block || "").toLowerCase().includes(searchQuery) ||
          (u.room  || "").toLowerCase().includes(searchQuery)
        );
        // Always keep the current user visible so the map doesn't hide them
        const withSelf = filtered.find(u => u.id === currentUser.id)
          ? filtered
          : [currentUser, ...filtered];

        if (withSelf.length <= 1 && !searchQuery.includes(currentUser.name?.toLowerCase())) {
          container.innerHTML = `<div class="inai-empty"><div class="inai-empty-icon">🔍</div><p>No hostelmates found for "${sanitize(searchQuery)}"</p></div>`;
          return;
        }
        hostelUsers = withSelf;
      }

      container.innerHTML = renderHostelSection(myHostel, hostelUsers);
    }

    function getHostelGender(users) {
      const genders = [...new Set(users.map(u => u.gender).filter(Boolean))];
      if (genders.length === 1) return genders[0] === "Female" ? "female" : "male";
      return "mixed";
    }

    function renderHostelSection(hostelName, users) {
      const isMyHostel = hostelName === (currentUser.hostel||"").trim();
      const genderClass = getHostelGender(users.filter(u => u.id !== currentUser.id || users.length > 1));
      const genderLabel = genderClass === "female" ? "♀ Girls" : genderClass === "male" ? "♂ Boys" : "Mixed";

      // Group by block
      const blockMap = {};
      users.forEach(u => {
        const block = (u.block || "?").trim().toUpperCase();
        if (!blockMap[block]) blockMap[block] = [];
        blockMap[block].push(u);
      });

      // Add current user's block if not present
      if (isMyHostel) {
        const myBlock = (currentUser.block || "?").trim().toUpperCase();
        if (!blockMap[myBlock]) blockMap[myBlock] = [];
        if (!blockMap[myBlock].find(u => u.id === currentUser.id)) blockMap[myBlock].push(currentUser);
      }

      const blocks = Object.keys(blockMap).sort();

      const blocksHtml = blocks.map(block => renderBlock(block, blockMap[block], isMyHostel)).join("");

      const occupiedCount = users.filter(u => u.id !== currentUser.id).length + (isMyHostel ? 1 : 0);

      return `
      <div class="hostel-section inai-card" style="padding:20px;margin-bottom:24px;">
        <div class="hostel-header">
          <div>
            <h3 style="font-size:17px;font-weight:800;color:var(--white);font-family:'Space Grotesk',sans-serif;">${sanitize(hostelName)}</h3>
            <p style="font-size:12px;color:var(--muted);margin-top:2px;">${occupiedCount} room${occupiedCount !== 1 ? "s" : ""} occupied · ${blocks.length} block${blocks.length !== 1 ? "s" : ""}</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span class="hostel-badge ${genderClass}">${genderLabel}</span>
            ${isMyHostel ? '<span style="font-size:11px;color:var(--cyan);font-weight:700;background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.25);padding:3px 10px;border-radius:20px;">📍 Your Hostel</span>' : ""}
          </div>
        </div>
        ${blocksHtml}
      </div>`;
    }

    function renderBlock(blockName, users, isMyHostel) {
      // Build room map for this block
      const roomMap = {};
      users.forEach(u => {
        const roomStr = (u.room || "").trim().toUpperCase().replace(/[^A-Z0-9\-]/g, "");
        if (roomStr) roomMap[roomStr] = u;
      });

      // Detect room numbering style:
      // Style A: plain numbers 1-20 (maxNum <= 20)
      // Style B: floor-prefix like 101, 203 (3-digit, floor*100 + unit)
      const roomNums = users.map(u => parseInt((u.room || "").replace(/\D/g, "")) || 0).filter(n => n > 0);
      const maxNum = roomNums.length > 0 ? Math.max(...roomNums) : 12;

      let floorBased = false;
      let floors = new Set();
      if (maxNum >= 100) {
        floorBased = true;
        roomNums.forEach(n => floors.add(Math.floor(n / 100)));
      }

      const tiles = [];

      if (floorBased) {
        // Render per floor: e.g., floor 1 → rooms 101-112, floor 2 → 201-212
        const unitsPerFloor = 12;
        [...floors].sort().forEach(floor => {
          for (let unit = 1; unit <= unitsPerFloor; unit++) {
            const roomKey = String(floor * 100 + unit);
            let occupant = roomMap[roomKey] || users.find(u => {
              const r = parseInt((u.room || "").replace(/\D/g, "")) || 0;
              return r === (floor * 100 + unit);
            }) || null;
            tiles.push(renderRoomTile(blockName, floor * 100 + unit, occupant));
          }
        });
        // Also add any rooms that don't fit the detected floors
        users.forEach(u => {
          const n = parseInt((u.room || "").replace(/\D/g, "")) || 0;
          if (n > 0 && !floors.has(Math.floor(n / 100))) {
            const already = tiles.some(() => false); // rooms outside floors already handled above
          }
        });
      } else {
        // Simple sequential rooms 1..N
        const totalRooms = Math.max(8, maxNum + 2);
        for (let i = 1; i <= totalRooms; i++) {
          const keys = [String(i).padStart(3, "0"), String(i), blockName + String(i).padStart(3, "0"), blockName + String(i)];
          let occupant = null;
          for (const k of keys) {
            if (roomMap[k]) { occupant = roomMap[k]; break; }
          }
          if (!occupant) {
            occupant = users.find(u => parseInt((u.room || "").replace(/\D/g, "")) === i) || null;
          }
          tiles.push(renderRoomTile(blockName, i, occupant));
        }
      }

      return `
      <div class="block-group">
        <div class="block-label">Block ${sanitize(blockName)}</div>
        <div class="room-grid">${tiles.join("")}</div>
      </div>`;
    }

    function renderRoomTile(block, roomNum, occupant) {
      if (!occupant) {
        return `<div class="room-tile empty">
          <div class="room-num">${block}${roomNum}</div>
          <div style="font-size:18px;opacity:0.15;margin-top:4px;">🚪</div>
        </div>`;
      }

      const isSelf = occupant.id === currentUser.id;
      const isConnected = connectedIds.has(occupant.id);
      const isFree = occupant.freeNow;

      let tileClass = "room-tile occupied";
      if (isSelf) tileClass = "room-tile self-tile";
      else if (isConnected) tileClass = "room-tile connected-tile";

      const color = isSelf ? "#06B6D4" : avatarColor(occupant.name);
      const init = initials(occupant.name);
      const displayName = isSelf ? "You" : (isConnected ? occupant.name.split(" ")[0] : (occupant.name.split(" ").map(w=>w[0]||"").join("")));

      const nameColor = isSelf ? "var(--cyan)" : isConnected ? "var(--green)" : "var(--offwht)";

      const tooltipData = JSON.stringify({
        id: occupant.id,
        name: isSelf ? currentUser.name : (isConnected ? occupant.name : null),
        branch: occupant.branch,
        year: occupant.year,
        room: `${block}${roomNum}`,
        freeNow: occupant.freeNow,
        isSelf,
        isConnected
      }).replace(/'/g, "&#39;");

      return `<div class="${tileClass}"
        onmouseenter="showRoomTooltip(event, '${tooltipData}')"
        onmouseleave="hideRoomTooltip()">
        ${isFree && !isSelf ? '<div class="free-dot"></div>' : ""}
        ${isConnected && !isSelf ? '<div class="connected-badge">✓</div>' : ""}
        <div class="room-num">${block}${roomNum}</div>
        <div class="room-avatar" style="background:${isSelf ? "rgba(6,182,212,0.2)" : ""}; border:${isSelf ? "2px solid var(--cyan)" : "none"};">
          ${isSelf
            ? `<span style="color:var(--cyan);font-size:18px;">⭐</span>`
            : `<div style="width:34px;height:34px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;">${init}</div>`
          }
        </div>
        <div class="room-name" style="color:${nameColor};">${sanitize(displayName)}</div>
      </div>`;
    }

    function showRoomTooltip(event, dataStr) {
      const tooltip = document.getElementById("room-tooltip");
      if (!tooltip) return;
      let data;
      try { data = JSON.parse(dataStr.replace(/&#39;/g, "'")); } catch(e) { return; }

      const nameDisplay = data.isSelf ? `<span style="color:var(--cyan);">⭐ You (${sanitize(currentUser.name)})</span>`
        : data.isConnected ? `<span style="color:var(--green);">✓ ${sanitize(data.name)}</span>`
        : `<span style="color:var(--muted);">🕵 Anonymous Student</span>`;

      const freeTag = data.freeNow
        ? `<span style="color:var(--green);font-size:10px;font-weight:700;">🟢 Free Now</span>`
        : `<span style="color:var(--muted);font-size:10px;">🔴 Busy</span>`;

      tooltip.innerHTML = `
        <div style="margin-bottom:6px;">${nameDisplay}</div>
        ${data.branch ? `<p style="font-size:11px;color:var(--muted);margin-bottom:2px;">${sanitize(data.branch)} · ${sanitize(data.year||"")}</p>` : ""}
        <p style="font-size:10px;color:var(--cyan);margin-bottom:4px;">Room ${sanitize(data.room)}</p>
        ${freeTag}
        ${!data.isSelf && !data.isConnected ? `<p style="font-size:9px;color:var(--muted);margin-top:6px;opacity:0.7;">Connect to reveal identity</p>` : ""}
      `;

      const x = Math.min(event.clientX + 12, window.innerWidth - 240);
      const y = Math.max(event.clientY - 10, 10);
      tooltip.style.left = x + "px";
      tooltip.style.top  = y + "px";
      tooltip.classList.add("visible");
    }

    function hideRoomTooltip() {
      const tooltip = document.getElementById("room-tooltip");
      if (tooltip) tooltip.classList.remove("visible");
    }
  </script>
</body>
</html>
