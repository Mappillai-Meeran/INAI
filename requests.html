<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INAI — Requests</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/favicon-bg-removed.png" />
</head>

<body>
  <div id="app"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/match.js"></script>
  <script src="js/request.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      showLoader();
      try {
        await initData();
      } finally {
        hideLoader();
      }
      const user = requireLogin();
      if (!user) return;

      const incoming = getIncomingRequests(user.id);
      const outgoing = getOutgoingRequests(user.id);
      const pending = incoming.filter(r => r.status === "pending").length;

      document.getElementById("app").innerHTML = `
    ${renderNav("requests")}
    <div class="inai-page">

      <div style="margin-bottom:20px;">
        <h2 class="inai-section-title" style="font-size:24px;">Requests</h2>
        <p class="inai-section-sub">Manage your study and roommate connection requests. Want to send a new request? Head to the <a href="match.html" style="color:var(--cyan); text-decoration:underline;">Find Match</a> page.</p>
      </div>

      <!-- Tabs -->
      <div class="inai-tabs">
        <button class="inai-tab active" id="tab-incoming" onclick="switchReqTab('incoming')">
          📥 Incoming
          <span id="incoming-pending-badge"></span>
        </button>
        <button class="inai-tab" id="tab-outgoing" onclick="switchReqTab('outgoing')">
          📤 Sent <span id="outgoing-active-count"></span>
        </button>
        <button class="inai-tab" id="tab-history" onclick="switchReqTab('history')">
          📜 History <span id="history-count"></span>
        </button>
      </div>

      <!-- Incoming -->
      <div id="incoming-section">
        ${pending > 0 ? `
          <h3 style="font-size:14px;font-weight:700;color:var(--gold);
            font-family:'Space Grotesk',sans-serif;
            margin-bottom:12px;">⌛ Pending (${pending})</h3>
          <div id="incoming-pending" style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;"></div>
          <div class="inai-divider"></div>
        ` : ""}

        <h3 style="font-size:14px;font-weight:700;color:var(--green);
          font-family:'Space Grotesk',sans-serif;
          margin-bottom:12px;margin-top:16px;">✓ Accepted</h3>
        <div id="incoming-accepted" style="display:flex;flex-direction:column;gap:12px;"></div>
      </div>

      <!-- Outgoing -->
      <div id="outgoing-section" style="display:none;">
        <div id="outgoing-list" style="display:flex;flex-direction:column;gap:12px;"></div>
      </div>

      <!-- History -->
      <div id="history-section" style="display:none;">
        <div id="history-list" style="display:flex;flex-direction:column;gap:12px;"></div>
      </div>

    </div>`;

      renderRequestsPage();
    });

    function switchReqTab(tab) {
      document.getElementById("incoming-section").style.display = tab === "incoming" ? "block" : "none";
      document.getElementById("outgoing-section").style.display = tab === "outgoing" ? "block" : "none";
      document.getElementById("history-section").style.display = tab === "history" ? "block" : "none";
      document.getElementById("tab-incoming").classList.toggle("active", tab === "incoming");
      document.getElementById("tab-outgoing").classList.toggle("active", tab === "outgoing");
      document.getElementById("tab-history").classList.toggle("active", tab === "history");
    }
  </script>
</body>

</html>
