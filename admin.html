<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INAI — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-table-container {
      max-height: 500px;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }

    .admin-table th,
    .admin-table td {
      padding: 14px 20px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .admin-table th {
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .admin-table td {
      font-size: 13px;
      color: var(--offwht);
    }

    .admin-table tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .admin-table tbody tr:hover td {
      background: rgba(255, 255, 255, 0.05);
    }

    .stat-card {
      background: linear-gradient(135deg, var(--indigo), var(--navy));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      flex: 1;
      min-width: 200px;
    }

    .stat-card h3 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-card p {
      font-size: 28px;
      font-weight: 800;
      color: var(--cyan);
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      showLoader();
      await initData();
      hideLoader();
      injectBaseStyles();
      await renderAdminPage();
    });

    async function renderAdminPage() {
      // Admin verification is checked by backend.
      const adminPass = sessionStorage.getItem("inai_admin_auth");
      if (adminPass !== "true" || !sessionStorage.getItem("inai_admin_password")) {
        const pass = prompt("Admin Verification Required. Enter Admin Password:");
        const result = await verifyAdminPassword(pass || "");
        if (!result.success) {
          alert(result.message || "Unauthorized access.");
          window.location.href = "index.html";
          return;
        }
        sessionStorage.setItem("inai_admin_auth", "true");
        sessionStorage.setItem("inai_admin_password", pass || "");
      }

      const users = getAllUsers();
      const requests = getAllRequests();

      const totalUsers = users.length;
      const totalConnections = requests.filter(r => r.status === "accepted").length;
      const totalPending = requests.filter(r => r.status === "pending").length;

      document.getElementById("app").innerHTML = `
        <nav class="inai-nav">
          <div class="inai-nav-logo">IN<span>AI</span> <span style="font-size:12px;color:var(--red);font-weight:700;">[ADMIN]</span></div>
          <div style="display:flex; align-items:center; gap:12px;">
            <a href="index.html" class="inai-btn inai-btn-outline" style="padding:6px 14px; font-size:12px;">
              Exit Admin
            </a>
          </div>
        </nav>
        
        <div class="inai-page" style="max-width:1080px;">
          <h2 class="inai-section-title">Admin Dashboard</h2>
          <p class="inai-section-sub">Manage users and monitor platform activity</p>

          <div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:32px;">
            <div class="stat-card">
              <h3>Total Users</h3>
              <p>${totalUsers}</p>
            </div>
            <div class="stat-card">
              <h3>Total Connections</h3>
              <p style="color:var(--green);">${totalConnections}</p>
            </div>
            <div class="stat-card">
              <h3>Pending Requests</h3>
              <p style="color:var(--gold);">${totalPending}</p>
            </div>
          </div>

          <div class="inai-card" style="padding: 24px;">
            <h3 style="font-size:16px; font-weight:700; color:var(--white); font-family:'Space Grotesk',sans-serif; margin-bottom:16px;">Registered Users</h3>
            
            <div class="admin-table-container">
              <table class="admin-table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Hostel & Block</th>
                  <th>Branch & Year</th>
                  <th>Strong Skills</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td>
                      <div style="display:flex; align-items:center; gap:10px;">
                        ${renderAvatar(u.name, 32)}
                        <div>
                          <div style="font-weight:700;">${u.name}</div>
                          <div style="font-size:11px; color:var(--muted);">${u.gender}</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <div>${u.hostel}</div>
                      <div style="font-size:11px; color:var(--muted);">Block ${u.block}</div>
                    </td>
                    <td>
                      <div>${u.branch}</div>
                      <div style="font-size:11px; color:var(--muted);">${u.year}</div>
                    </td>
                    <td>
                      <div style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${u.strongSkills.map(s => s.subject).join(', ')}
                      </div>
                    </td>
                    <td>
                      <button onclick="deleteUser('${u.id}')" style="background:transparent; border:1px solid var(--red); color:var(--red); padding:4px 8px; border-radius:6px; cursor:pointer; font-size:11px; font-weight:700;">Delete</button>
                    </td>
                  </tr>
                `).join('')}
                ${users.length === 0 ? '<tr><td colspan="5" style="text-align:center; color:var(--muted);">No users found.</td></tr>' : ''}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      `;
    }

    function deleteUser(userId) {
      showConfirm("Are you sure you want to delete this user? This cannot be undone.", async () => {
        const success = await deleteUserAPI(userId);
        
        if (success) {
          // Check if deleted user is current session
          const session = getSession();
          if (session && session.id === userId) {
            clearSession();
          }

          showToast("User deleted successfully.", "success");
          await renderAdminPage();
        } else {
          showToast("Failed to delete user.", "error");
        }
      });
    }
  </script>
</body>

</html>
