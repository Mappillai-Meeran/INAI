<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INAI — Study Rooms</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/favicon-bg-removed.png" />
</head>
<body>
  <div id="app"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      showLoader();
      try { await initData(); } finally { hideLoader(); }
      const user = requireLogin();
      if (!user) return;
      renderRoomsPage(user);
    });

    function renderRoomsPage(user) {
      document.getElementById("app").innerHTML = `
    ${renderNav("rooms")}
    <div class="inai-page" style="max-width:800px;">

      <div style="margin-bottom:20px;">
        <h2 class="inai-section-title" style="font-size:24px;">\u{1F3DA}\u{FE0F} Study Rooms</h2>
        <p class="inai-section-sub">Create or join group study sessions with students in your hostel.</p>
      </div>

      <!-- Create Room Card -->
      <div class="inai-card" style="margin-bottom:24px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; cursor:pointer;" onclick="toggleCreateForm()">
          <h3 style="font-size:15px;font-weight:700;color:var(--cyan);font-family:'Space Grotesk',sans-serif;">
            \u{2795} Create Study Room
          </h3>
          <span id="create-toggle-icon" style="color:var(--muted);font-size:18px;">+</span>
        </div>
        <div id="create-form" style="display:none;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label class="inai-label">Room Name</label>
              <input type="text" id="sr-name" class="inai-input" placeholder="e.g. DSA Prep Session" />
            </div>
            <div>
              <label class="inai-label">Subject</label>
              <input type="text" id="sr-subject" class="inai-input" placeholder="e.g. DSA" list="skills-list" />
            </div>
            <div>
              <label class="inai-label">Max Members</label>
              <select id="sr-max" class="inai-select">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
                <option value="8">8</option>
                <option value="10">10</option>
              </select>
            </div>
            <div>
              <label class="inai-label">Location (optional)</label>
              <input type="text" id="sr-location" class="inai-input" placeholder="e.g. Block A Common Room" />
            </div>
            <div style="grid-column:1/-1;">
              <label class="inai-label">Scheduled Time</label>
              <input type="datetime-local" id="sr-time" class="inai-input" />
            </div>
          </div>
          <button onclick="createRoom()" class="inai-btn inai-btn-primary" style="margin-top:16px;width:100%;padding:12px;font-size:14px;">
            Create Room
          </button>
        </div>
      </div>

      <!-- Active Rooms -->
      <h3 class="inai-section-title" style="font-size:16px;">Active Sessions</h3>
      <p class="inai-section-sub">Rooms in your hostel</p>
      <div id="rooms-list" style="display:flex;flex-direction:column;gap:14px;">
        <div style="text-align:center;padding:40px;color:var(--muted);font-size:13px;">Loading rooms...</div>
      </div>
    </div>`;
      loadRooms(user);
    }

    function toggleCreateForm() {
      const form = document.getElementById("create-form");
      const icon = document.getElementById("create-toggle-icon");
      const isHidden = form.style.display === "none" || form.style.display === "";
      form.style.display = isHidden ? "block" : "none";
      icon.textContent = isHidden ? "\u{2212}" : "+";
    }

    async function createRoom() {
      const user = getSession();
      const name = document.getElementById("sr-name")?.value.trim();
      const subject = document.getElementById("sr-subject")?.value.trim();
      const maxMembers = parseInt(document.getElementById("sr-max")?.value || "4");
      const location = document.getElementById("sr-location")?.value.trim();
      const timeInput = document.getElementById("sr-time")?.value;
      const scheduledTime = timeInput ? new Date(timeInput).getTime() : null;

      if (!name) return showToast("Room name is required.", "error");
      if (!subject) return showToast("Subject is required.", "error");

      const result = await createStudyRoom({ name, subject, maxMembers, location, scheduledTime });
      if (result.success) {
        showToast("Study room created!", "success");
        toggleCreateForm();
        document.getElementById("sr-name").value = "";
        document.getElementById("sr-subject").value = "";
        document.getElementById("sr-location").value = "";
        if (typeof burstConfetti === "function") burstConfetti();
        loadRooms(user);
      } else {
        showToast(result.message || "Failed to create room.", "error");
      }
    }

    async function loadRooms(user) {
      const container = document.getElementById("rooms-list");
      const rooms = await fetchStudyRooms();
      if (rooms.length === 0) {
        container.innerHTML = `<div class="inai-empty" style="text-align:center;padding:48px 20px;">
          <div class="inai-empty-icon">\u{1F3DA}\u{FE0F}</div>
          <p style="color:var(--muted);">No study rooms yet. Create the first one!</p>
        </div>`;
        return;
      }
      container.innerHTML = rooms.map(room => {
        const isMember = room.members.some(m => m.userId === user.id);
        const isFull = room.members.length >= room.maxMembers;
        const isCreator = room.createdBy === user.id;
        const timeStr = room.scheduledTime
          ? new Date(room.scheduledTime).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
          : "Flexible";
        const countdownStr = room.scheduledTime ? formatTimeUntil(room.scheduledTime) : "";

        let actionBtn = "";
        if (isMember) {
          actionBtn = `<button onclick="leaveRoom('${room.id}')" class="inai-btn" style="background:transparent;border:1px solid var(--red);color:var(--red);padding:8px 16px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;">Leave</button>`;
        } else if (isFull) {
          actionBtn = `<span style="color:var(--muted);font-size:12px;font-weight:600;">Full</span>`;
        } else {
          actionBtn = `<button onclick="joinRoom('${room.id}')" class="inai-btn inai-btn-primary" style="padding:8px 16px;font-size:12px;">Join</button>`;
        }

        return `<div class="inai-card" style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <h4 style="font-size:15px;font-weight:700;color:var(--white);font-family:'Space Grotesk',sans-serif;">${sanitize(room.name)}</h4>
                <span style="font-size:11px;background:rgba(6,182,212,0.1);color:var(--cyan);padding:2px 10px;border-radius:10px;font-weight:600;">${sanitize(room.subject)}</span>
              </div>
              <p style="font-size:12px;color:var(--muted);margin-top:4px;">
                Created by ${sanitize(room.createdByName)} \u{00B7} ${room.members.length}/${room.maxMembers} members
              </p>
              <p style="font-size:12px;color:var(--muted);">
                ${room.location ? sanitize(room.location) + " \u{00B7} " : ""}\u{1F552} ${timeStr}
                ${countdownStr ? `<span style="color:var(--cyan);font-weight:600;"> \u{00B7} ${countdownStr}</span>` : ""}
              </p>
            </div>
            <div style="flex-shrink:0;">${actionBtn}</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${room.members.map(m => {
              const isMe = m.userId === user.id;
              const initial = m.userName ? m.userName.charAt(0).toUpperCase() : "?";
              return `<span style="display:inline-flex;align-items:center;gap:4px;background:${isMe ? 'rgba(99,102,241,0.15)' : 'rgba(255,255,255,0.03)'};border:1px solid ${isMe ? 'rgba(99,102,241,0.3)' : 'var(--border)'};border-radius:16px;padding:3px 10px 3px 6px;font-size:11px;font-weight:600;color:${isMe ? 'var(--violet)' : 'var(--offwht)'};">
                <span style="width:18px;height:18px;border-radius:50%;background:${isMe ? 'var(--violet)' : 'var(--muted)'};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">${initial}</span>
                ${sanitize(m.userName)}${isMe ? " (you)" : ""}
              </span>`;
            }).join("")}
          </div>
        </div>`;
      }).join("");
    }

    async function joinRoom(roomId) {
      const result = await joinStudyRoom(roomId);
      if (result.success) {
        showToast("Joined study room!", "success");
        const user = getSession();
        loadRooms(user);
      } else {
        showToast(result.message || "Failed to join.", "error");
      }
    }

    async function leaveRoom(roomId) {
      const user = getSession();
      const rooms = await fetchStudyRooms();
      const room = rooms.find(r => r.id === roomId);
      const isLast = room && room.members.length === 1 && room.members[0].userId === user.id;

      const doLeave = async () => {
        const result = await leaveStudyRoom(roomId);
        if (result.success) {
          if (result.roomClosed) {
            showToast("Room closed — you were the last member.", "info");
          } else {
            showToast("Left study room.", "info");
          }
          loadRooms(getSession());
        } else {
          showToast(result.message || "Failed to leave.", "error");
        }
      };

      if (isLast) {
        showConfirm("You're the last member. Leaving will permanently close this room. Continue?", doLeave);
      } else {
        await doLeave();
      }
    }
  </script>
</body>
</html>
